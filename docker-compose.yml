# Fantasy Roast Bot Docker Compose Configuration

services:
  fantasy-roast-bot:
    build: .
    container_name: fantasy-roast-bot
    restart: unless-stopped
    # Temporary port mapping for direct access while troubleshooting Traefik
    ports:
      - "32144:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DISCORD_WEBHOOK_MEL=${DISCORD_WEBHOOK_MEL}
      - DISCORD_WEBHOOK_TODD=${DISCORD_WEBHOOK_TODD}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - MAX_TOKENS=${MAX_TOKENS:-280}
    volumes:
      - ./logs:/app/logs
    networks:
      - fantasy-bot-network

networks:
  fantasy-bot-network:
    driver: bridge
