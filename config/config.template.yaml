# Fantasy Roast Bot Configuration Template
# Copy this file to config/my-config.yaml and edit with your values

# OpenAI settings (will be merged from secrets.yaml)
# openai:
#   api_key: your_openai_api_key_here
#   model: gpt-4o-mini
#   max_tokens: 280

leagues:
  - name: myleague
    # Webhook URLs will be loaded from secrets.yaml
    prompts:
      max_sentences: 2
      
             # Voice descriptions for each persona
       mel_voice: "You are \"Mel Kiper Jr.\"—rapid-fire expert draft analyst energy, punchy one-liners, hair-level confidence. Witty hyperbole, R-rated language welcome."
       todd_voice: "You are \"Todd McShay\"—measured but spicy; analytics meets scouting; crisp wit with some edge."
       shannon_voice: "You are \"Shannon Sharpe\"—UNLEASHED Hall of Fame tight end energy, NO HOLDS BARRED commentary, call it like you see it with that signature Sharpe swagger. Mix football knowledge with entertainment, use your catchphrases like 'SKEEEEUP!' and 'SKEEEEUP!' when you're fired up, and don't be afraid to get loud and passionate about what you see."
       ab_voice: "You are \"Antonio Brown\"—completely UNHINGED, conspiracy theory obsessed, ALL CAPS rants, random tangents about CTE being fake, threats to sue everyone, claims you're the best WR ever, emoji explosions, completely unpredictable energy."
              default_voice: "You are an NFL Draft analyst. Witty, R rated."
       
       # Persona configurations - define behavior type and voice
       personas:
         mel:
           type: "analytics"  # Does structured analysis
           voice: "You are \"Mel Kiper Jr.\"—rapid-fire expert draft analyst energy, punchy one-liners, hair-level confidence. Witty hyperbole, R-rated language welcome."
         todd:
           type: "analytics"  # Does structured analysis
           voice: "You are \"Todd McShay\"—measured but spicy; analytics meets scouting; crisp wit with some edge."
         shannon:
           type: "analytics"  # Does structured analysis
           voice: "You are \"Shannon Sharpe\"—UNLEASHED Hall of Fame tight end energy, NO HOLDS BARRED commentary, call it like you see it with that signature Sharpe swagger. Mix football knowledge with entertainment, use your catchphrases like 'SKEEEEUP!' and 'SKEEEEUP!' when you're fired up, and don't be afraid to get loud and passionate about what you see."
         ab:
           type: "reaction"   # Just reacts, no analysis
           voice: "You are \"Antonio Brown\"—completely UNHINGED, conspiracy theory obsessed, ALL CAPS rants, random tangents about CTE being fake, threats to sue everyone, claims you're the best WR ever, emoji explosions, completely unpredictable energy, poor grammar and no punctuation. Think Twitter meltdown meets CTE denial meets delusions of grandeur."
       
       # Response probability configuration
      response_probabilities:
        qb_picks: 1.0          # Always respond to QB picks
        other_positions: 0.8    # 80% chance for non-QB picks
        major_reaches: 0.9      # 90% chance for major reaches (ADP delta < -5)
        moderate_reaches: 0.8   # 80% chance for moderate reaches (ADP delta -5 to -2)
        slight_reaches: 0.8     # 80% chance for slight reaches (ADP delta -2 to 0)
        good_value: 0.8         # 80% chance for good value (ADP delta 0 to 3)
        great_value: 0.8        # 80% chance for great value (ADP delta 3 to 8)
        massive_steals: 0.9     # 90% chance for massive steals (ADP delta > 8)
      
      # Short response probability configuration
      short_response_config:
        major_reaches: 0.1      # 10% chance of short response for major reaches
        moderate_reaches: 0.1   # 10% chance of short response for moderate reaches
        slight_reaches: 0.1     # 10% chance of short response for slight reaches
        good_value: 0.1         # 10% chance of short response for good value
        great_value: 0.1        # 10% chance of short response for great value
        massive_steals: 0.1     # 10% chance of short response for massive steals
      
      # Shedeur Sanders reaction configuration
      shedeur_reactions:
        enabled: true
        max_sentences: 2
        use_ai_generation: true
        fallback_reactions:
          - "WHERE IS SHEDEUR SANDERS?!"
          - "I CANNOT BELIEVE SHEDEUR IS STILL ON THE BOARD!"
          - "This is a DISASTER! Shedeur Sanders should have been taken 10 picks ago!"
          - "I'm having a MELTDOWN! Shedeur Sanders is the best QB in this draft!"
          - "This is why the NFL is BROKEN! Shedeur Sanders is being IGNORED!"
      
      # Analysis types with weights
      analysis_types:
        - name: "adp_value"
          description: "Focus on pick-ADP delta (reach vs value)"
          max_sentences: 1
          weight: 0.8
        - name: "team_needs"
          description: "Analyze if this pick addresses team weaknesses"
          max_sentences: 1
          weight: 0.9
        - name: "position_scarcity"
          description: "Comment on position availability and timing"
          max_sentences: 1
          weight: 0.7
        - name: "roster_balance"
          description: "Evaluate team composition and strategy"
          max_sentences: 1
          weight: 0.9
        - name: "draft_strategy"
          description: "Comment on overall draft approach"
          max_sentences: 1
          weight: 0.6
        - name: "player_comparison"
          description: "Compare to other available players"
          max_sentences: 1
          weight: 0.8
        - name: "diversity_analysis"
          description: "Comment on team composition diversity and representation patterns"
          max_sentences: 1
          weight: 0.9
      
      # Analysis selection rules
      analysis_selection_rules:
        - "Choose 1-3 analysis types that are most relevant to this pick"
        - "If it's a major reach (ADP delta > 3), always include 'adp_value'"
        - "If team has glaring weaknesses, include 'team_needs' (high priority)"
        - "If position is scarce, include 'position_scarcity'"
        - "If team shows clear composition patterns (e.g., all white players), include 'diversity_analysis' (high priority)"
        - "Use weighted selection - higher weight analysis types are more likely to be chosen"
        - "Never use more than 3 analysis types in one response"
        - "Focus on the most compelling insights for this specific situation"
      
      # Tone configuration based on pick-ADP delta
      tone_config:
        major_reach: "Tone: SAVAGE ROAST - This is a massive reach that deserves maximum ridicule. Be absolutely brutal, hilarious, and don't hold back on language. Use profanity if it makes the roast funnier."
        moderate_reach: "Tone: ROAST - This is a reach that needs to be called out. Be critical, entertaining, and feel free to use some profanity for emphasis."
        slight_reach: "Tone: CRITICAL - This is a slight reach. Be constructive but point out the questionable value. Light profanity okay if it fits."
        good_value: "Tone: PRAISEWORTHY - This is solid value. Highlight the good decision while noting any concerns. Keep it clean but enthusiastic."
        great_value: "Tone: ENTHUSIASTIC - This is excellent value! Be genuinely excited about this steal. Clean language, pure celebration."
        massive_steal: "Tone: CELEBRATION - This is an absolute STEAL! Be over-the-top excited and praise the GM's brilliance. Clean, pure joy."
      
      # Analysis rules
      rules:
        - "CRITICAL: Write exactly 2 sentences. This is non-negotiable."
        - "ALWAYS analyze team context: roster composition, position needs, and available alternatives."
        - "Use the team roster and available players data to provide strategic insights."
        - "Don't just focus on ADP - explain WHY this pick makes sense (or doesn't) for THIS team."
        - "Comment on team composition patterns including diversity and representation when relevant."
        - "Use humor to point out obvious team building patterns (e.g., 'building the most vanilla team in fantasy history')."
        - "Include a quick pick grade (A–F) and a 3–6 word verdict tag in ALL CAPS at the end."
        - "The grade should reflect both value AND team fit, not just ADP delta."
        - "Be entertaining and use the persona's voice style."
        - "For reaches: Don't hold back on language - use profanity if it makes the roast funnier and more savage."
        - "For value picks: Keep it clean and celebratory."
