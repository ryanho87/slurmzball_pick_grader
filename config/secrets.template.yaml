# Fantasy Roast Bot Secrets Template
# Copy this file to config/my-secrets.yaml and edit with your actual values
# WARNING: This file contains sensitive information - keep it secure!

openai:
  api_key: your_openai_api_key_here
  model: gpt-4o-mini
  max_tokens: 280

leagues:
  - name: myleague
    # Discord webhook URLs for each persona
    mel: https://discord.com/api/webhooks/your_mel_webhook_url_here
    todd: https://discord.com/api/webhooks/your_todd_webhook_url_here
    shannon: https://discord.com/api/webhooks/your_shannon_webhook_url_here
    ab: https://discord.com/api/webhooks/your_ab_webhook_url_here

